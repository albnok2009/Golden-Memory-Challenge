<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الذاكرة الذهبية</title><style>body{font-family:Tahoma;background:linear-gradient(120deg,#071532,#153d78);color:white;text-align:center}main{max-width:700px;margin:auto}button,input,select{padding:12px;margin:5px;border-radius:12px;font:inherit}button{background:#ffd36d;color:#13234b;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tile{min-height:80px;overflow-wrap:anywhere}h1{color:#ffd36d}</style><main><h1>🏆 تحدي الذاكرة الذهبية</h1><div id="setup"><input id="a" placeholder="المتسابق الأول"><input id="b" placeholder="المتسابق الثاني"><p><select id="mode"><option value="solo">فردي</option><option value="duel">ثنائي</option></select><select id="level"></select></p><button onclick="start()">ابدأ</button></div><div id="game" hidden><h2 id="status"></h2><p id="time"></p><div id="grid" class="grid"></div><button onclick="home()">إنهاء</button></div><div id="result" hidden><h2 id="winner"></h2><button id="again" onclick="start()">إعادة اللعب</button><button onclick="home()">الرئيسية</button></div></main><script>let $=x=>document.getElementById(x),d=x=>String(x).replace(/[0-9]/g,n=>'٠١٢٣٤٥٦٧٨٩'[+n]),nums=[3,4,5,6,7,8,10,12],cards=[],opened=[],matched=new Set(),scores=[0,0],turn=0,duel=false,golden=false,locked=false,timer,seconds=15,epoch=0;nums.forEach((n,i)=>$('level').add(new Option('المستوى '+d(i+1)+' — '+d(n)+' أزواج',n)));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(g=false){golden=g;duel=$('mode').value==='duel';scores=[0,0];turn=0;round(g?5:+$('level').value)}function round(n){clearInterval(timer);epoch++;opened=[];matched=new Set();locked=false;let pool=[];for(let a=1;a<=10;a++)for(let b=a;b<=10;b++)pool.push([a,b,a*b]);shuffle(pool);let unique=new Set(),chosen=[];for(let x of pool){if(!unique.has(x[2])){unique.add(x[2]);chosen.push(x)}if(chosen.length===n)break}cards=shuffle(chosen.flatMap((x,i)=>[{id:i,t:d(x[0])+' × '+d(x[1])+' = ؟'},{id:i,t:d(x[2])}]));$('setup').hidden=true;$('result').hidden=true;$('game').hidden=false;draw();clock()}function clock(){clearInterval(timer);let e=epoch;seconds=15;$('time').textContent='المهلة: '+d(seconds);timer=setInterval(()=>{if(e!==epoch)return;if(locked)return;$('time').textContent='المهلة: '+d(--seconds);if(seconds<=0){clearInterval(timer);locked=true;setTimeout(()=>{if(e!==epoch)return;opened=[];if(duel)turn=1-turn;locked=false;draw();clock()},3000)}},1000)}function draw(){$('status').textContent=(duel?'الدور: '+(turn===0?$('a').value||'الأول':$('b').value||'الثاني')+' | ':'')+'الأول: '+d(scores[0])+(duel?' | الثاني: '+d(scores[1]):'');$('grid').innerHTML='';cards.forEach((c,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=matched.has(i)||opened.includes(i)?c.t:d(i+1);b.style.background=matched.has(i)?'#a5e5b6':opened.includes(i)?'#fff':'#ffd36d';b.disabled=locked||matched.has(i);b.onclick=()=>pick(i);$('grid').append(b)})}function pick(i){if(locked||opened.includes(i))return;opened.push(i);draw();if(opened.length===2){locked=true;clearInterval(timer);let [a,b]=opened,ok=cards[a].id===cards[b].id,e=epoch;if(ok){matched.add(a);matched.add(b);scores[turn]++}setTimeout(()=>{if(e!==epoch)return;opened=[];locked=false;if(matched.size===cards.length){finish();return}if(duel&&!ok)turn=1-turn;draw();clock()},ok?650:3000)}}function finish(){clearInterval(timer);epoch++;$('game').hidden=true;$('result').hidden=false;let tie=duel&&scores[0]===scores[1];$('winner').textContent=tie?'تعادل — حسم ذهبي':duel?'الفائز: '+(scores[0]>scores[1]?$('a').value||'الأول':$('b').value||'الثاني'):'أحسنت! أكملت الأزواج';$('again').textContent=tie?'ابدأ الجولة الذهبية (٥ أزواج)':'العب مجددًا';$('again').onclick=tie?()=>start(true):()=>start()}function home(){clearInterval(timer);epoch++;$('setup').hidden=false;$('game').hidden=true;$('result').hidden=true}</script></html>
